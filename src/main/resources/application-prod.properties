# Production. Every value comes from the server environment; there are no defaults on purpose,
# so a missing variable stops startup instead of silently pointing somewhere wrong.

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Comma-separated list of the real frontend origins, e.g. https://satmis.com
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Transactional mail provider (e.g. Resend, Brevo) over SMTP with STARTTLS
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
app.mail.from=${MAIL_FROM}
# Public frontend address, e.g. https://satmis.com; verification links point there
app.email-verification.link-base-url=${FRONTEND_BASE_URL}/verify-email
app.password-reset.link-base-url=${FRONTEND_BASE_URL}/reset-password

# Off unless explicitly enabled, e.g. for a demo; when on, the docs are public.
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}

# Cloudflare R2: endpoint https://<account-id>.r2.cloudflarestorage.com, an API token with access to the
# bucket only, and the bucket's public custom domain without a trailing slash, e.g. https://img.satmis.com
app.storage.endpoint=${STORAGE_ENDPOINT}
app.storage.bucket=${STORAGE_BUCKET}
app.storage.access-key=${STORAGE_ACCESS_KEY}
app.storage.secret-key=${STORAGE_SECRET_KEY}
app.storage.public-base-url=${STORAGE_PUBLIC_BASE_URL}
