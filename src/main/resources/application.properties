spring.application.name=satmis-backend
server.port=8080

# Local secrets (JWT_SECRET, DB_*) come from the git-ignored .env in the project root, so STS,
# terminal and Maven all see them. "optional": on servers the file is absent and real
# environment variables are used instead; those also take precedence over .env when both exist.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/satmis}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:1234}

# Flyway owns the schema (src/main/resources/db/migration); Hibernate only checks the entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

app.jwt.secret=${JWT_SECRET}
app.jwt.access-expiration-ms=900000
app.jwt.refresh-expiration-ms=604800000