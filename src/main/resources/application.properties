spring.application.name=satmis-backend
server.port=8080

# Settings shared by every environment. Environment-specific values live in application-dev and
# application-prod; with no active profile there is no datasource, so the app refuses to start.

# Local secrets (JWT_SECRET, DB_*) come from the git-ignored .env in the project root, so STS,
# terminal and Maven all see them. "optional": on servers the file is absent and real
# environment variables are used instead; those also take precedence over .env when both exist.
spring.config.import=optional:file:.env[.properties]

# Spring does not read the env-style SPRING_PROFILES_ACTIVE key from a .env file on its own, so it
# is mapped here. A real environment variable of the same name still takes precedence.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:}

# Flyway owns the schema (src/main/resources/db/migration); Hibernate only checks the entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# API docs are opt-in: only the dev profile (or SWAGGER_ENABLED=true) exposes them.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

app.jwt.secret=${JWT_SECRET}
app.jwt.access-expiration-ms=900000
app.jwt.refresh-expiration-ms=604800000
# Daily at 03:00 UTC (06:00 Turkey time). "-" disables the job.
app.jwt.refresh-token-cleanup-cron=0 0 3 * * *

# Per client IP. Behind a reverse proxy the real client IP must be forwarded (server.forward-headers-strategy),
# otherwise every user shares the proxy's address and its limit.
app.rate-limit.enabled=true
app.rate-limit.max-tracked-clients=10000
app.rate-limit.login.capacity=10
app.rate-limit.login.period=1m
app.rate-limit.register.capacity=5
app.rate-limit.register.period=10m
app.rate-limit.refresh.capacity=30
app.rate-limit.refresh.period=1m
app.rate-limit.resend-verification.capacity=3
app.rate-limit.resend-verification.period=10m

# The SMTP server is set per profile; a mail server that hangs must not hold request threads.
app.mail.enabled=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.email-verification.token-ttl=24h
