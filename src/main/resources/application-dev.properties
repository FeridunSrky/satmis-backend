# Local development. Activated with SPRING_PROFILES_ACTIVE=dev in .env.

# URL and user default to the machine's local PostgreSQL; the password must come from .env.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/satmis}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# Mailpit from docker-compose catches every mail; read them at http://localhost:8025
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
app.mail.from=satmis.com <no-reply@satmis.local>
app.auth.refresh-cookie.secure=false
app.email-verification.link-base-url=${FRONTEND_BASE_URL:http://localhost:5173}/verify-email
app.password-reset.link-base-url=${FRONTEND_BASE_URL:http://localhost:5173}/reset-password

# SeaweedFS from docker-compose: `docker compose up -d seaweedfs seaweedfs-init`. The keys come from .env.
app.storage.endpoint=${STORAGE_ENDPOINT:http://localhost:8333}
app.storage.bucket=${STORAGE_BUCKET:satmis-images}
app.storage.access-key=${STORAGE_ACCESS_KEY}
app.storage.secret-key=${STORAGE_SECRET_KEY}
app.storage.public-base-url=${STORAGE_PUBLIC_BASE_URL:http://localhost:8333/satmis-images}
