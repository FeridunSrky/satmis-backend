# Integration tests log in and register many times from the same address; RateLimitIT turns limits back on.
app.rate-limit.enabled=false

# No mail server in most tests; EmailVerificationIT starts Mailpit and turns mail on.
app.mail.enabled=false
app.mail.from=test@satmis.local
app.email-verification.link-base-url=http://localhost:5173/verify-email
app.password-reset.link-base-url=http://localhost:5173/reset-password

# Tests run the image cleanup themselves instead of waiting for the hourly schedule
app.listing-images.cleanup-cron=-

# Most tests never touch storage and the client connects lazily; ObjectStorageIT points these at SeaweedFS.
app.storage.endpoint=http://localhost:9
app.storage.bucket=satmis-images
app.storage.access-key=test
app.storage.secret-key=test
app.storage.public-base-url=http://localhost:9/satmis-images
